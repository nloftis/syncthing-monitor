services:
  synology-monitor:
    image: python:3.13-alpine
    container_name: synology-monitor
    user: "1027:100" # svc-docker / users
    environment:
      TZ: Pacific/Honolulu
    volumes:
      - ./synology-monitor.py:/app/synology-monitor.py:ro
      - ./state:/state
    # Take the variables in .env and put them into the container's environment.
    env_file:
      - .env
    working_dir: /app # cwd
    command:
      - python
      - -u
      - /app/synology-monitor.py
    network_mode: host
    restart: unless-stopped
